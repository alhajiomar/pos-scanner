<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماسح الباركود — الحاجي عمر</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: Arial, sans-serif; background:#0d1117; color:#fff; min-height:100vh; display:flex; flex-direction:column; }
.header { background:#005f92; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:16px; font-weight:700; }
.header p { font-size:11px; opacity:.7; margin-top:2px; }
#qr-reader { width:100%; background:#000; }
#qr-reader video { width:100% !important; }
/* إخفاء عناصر html5-qrcode الافتراضية */
#qr-reader img { display:none !important; }
#qr-reader__dashboard_section_csr span { display:none !important; }
#qr-reader__status_span { display:none !important; }
#qr-reader__camera_selection { width:100%; padding:6px; border-radius:6px; background:#161b22; color:#fff; border:1px solid #30363d; margin-bottom:6px; }
.stats-bar { background:#005f92; padding:10px 16px; display:flex; gap:16px; align-items:center; }
.stat-item { text-align:center; color:#fff; }
.stat-num { font-size:22px; font-weight:700; line-height:1; }
.stat-lbl { font-size:10px; opacity:.6; margin-top:2px; }
.last-scan { background:#161b22; padding:12px 16px; min-height:56px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #30363d; }
.last-scan-icon { font-size:24px; flex-shrink:0; }
.last-scan-info { flex:1; }
.last-scan-name { font-size:15px; font-weight:700; color:#fff; }
.last-scan-code { font-size:12px; color:#8b949e; margin-top:2px; }
.items-list { flex:1; overflow-y:auto; padding:8px 16px; background:#0d1117; }
.item-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #21262d; }
.item-name { font-size:13px; color:#e6edf3; font-weight:500; }
.item-detail { display:flex; align-items:center; gap:10px; }
.item-qty { font-size:12px; color:#8b949e; background:#21262d; padding:2px 8px; border-radius:10px; }
.item-price { font-size:13px; color:#2ecc71; font-weight:700; }
.bottom-bar { background:#161b22; padding:12px 16px; border-top:1px solid #30363d; }
.total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.total-label { font-size:14px; color:#8b949e; }
.total-amount { font-size:22px; font-weight:700; color:#2ecc71; }
.btn { width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:15px; font-weight:700; margin-bottom:8px; }
.btn-finish { background:#2ecc71; color:#fff; }
.btn-manual { background:#0288d1; color:#fff; font-size:13px; padding:10px; }
.manual-row { display:flex; gap:8px; }
.manual-input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #30363d; background:#21262d; color:#fff; font-size:15px; }
.status-msg { text-align:center; font-size:12px; color:#8b949e; padding:6px 0; }
.scan-flash { animation: flash 0.3s ease; }
@keyframes flash { 0%,100%{background:#0d1117} 50%{background:#1a3a2a} }
.empty-msg { text-align:center; color:#8b949e; padding:30px 0; font-size:13px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🛒 ماسح الباركود</h1>
    <p id="mode-label">الحاجي عمر — نظام الكاشير</p>
  </div>
  <div id="scan-badge" style="background:rgba(46,204,113,.2);border:1px solid #2ecc71;border-radius:20px;padding:4px 12px;font-size:12px;color:#2ecc71">جاهز</div>
</div>

<!-- الكاميرا -->
<div id="qr-reader"></div>
<div class="status-msg" id="status-msg">جاري تشغيل الكاميرا...</div>

<!-- إحصائيات (وضع متواصل فقط) -->
<div class="stats-bar" id="stats-bar" style="display:none">
  <div class="stat-item"><div class="stat-num" id="s-count">0</div><div class="stat-lbl">صنف</div></div>
  <div class="stat-item"><div class="stat-num" id="s-items">0</div><div class="stat-lbl">وحدة</div></div>
  <div class="stat-item" style="margin-right:auto"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">الإجمالي</div></div>
</div>

<!-- آخر مسح -->
<div class="last-scan" id="last-scan-row">
  <div class="last-scan-icon">🔍</div>
  <div class="last-scan-info">
    <div class="last-scan-name" id="ls-name">في انتظار المسح...</div>
    <div class="last-scan-code" id="ls-code">وجّه الكاميرا نحو الباركود</div>
  </div>
</div>

<!-- قائمة الأصناف (وضع متواصل) -->
<div class="items-list" id="items-list" style="display:none">
  <div class="empty-msg" id="empty-msg">لا توجد أصناف بعد — ابدأ المسح</div>
</div>

<!-- الإدخال اليدوي -->
<div class="bottom-bar">
  <div id="total-section" style="display:none">
    <div class="total-row">
      <span class="total-label">الإجمالي</span>
      <span class="total-amount" id="total-display">0</span>
    </div>
    <button class="btn btn-finish" onclick="finishAndClose()">✅ إنهاء وإرسال للنظام</button>
  </div>
  <div class="manual-row">
    <input type="text" class="manual-input" id="manual-input" placeholder="إدخال يدوي..." inputmode="numeric"
      onkeydown="if(event.key==='Enter') manualScan()">
    <button class="btn btn-manual" style="width:auto;padding:10px 14px" onclick="manualScan()">إدخال</button>
  </div>
</div>

<script>
var MODE = 'pos'; // pos, continuous, item
var scannedItems = [];
var lastCode = '';
var posUrl = '';
var scanner = null;

// قراءة المعاملات
var params = new URLSearchParams(window.location.search);
posUrl = params.get('pos') || '';
var modeParam = params.get('mode') || 'pos';

if (modeParam === 'continuous') {
  MODE = 'continuous';
  document.getElementById('mode-label').textContent = 'وضع المسح المتواصل';
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('items-list').style.display = 'block';
  document.getElementById('total-section').style.display = 'block';
} else if (modeParam === 'item') {
  MODE = 'item';
  document.getElementById('mode-label').textContent = 'مسح باركود صنف';
  document.getElementById('scan-badge').textContent = 'مسح واحد';
}

// تهيئة الماسح
function initScanner() {
  scanner = new Html5Qrcode('qr-reader');
  var config = {
    fps: 15,
    qrbox: { width: Math.min(window.innerWidth - 40, 280), height: 130 },
    aspectRatio: window.innerWidth / 320,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR
    ]
  };

  scanner.start(
    { facingMode: 'environment' },
    config,
    onScanSuccess,
    function() {}
  ).then(function() {
    document.getElementById('status-msg').textContent = '✅ الكاميرا تعمل — وجّه نحو الباركود';
    document.getElementById('scan-badge').textContent = '🟢 تعمل';
  }).catch(function() {
    // جرب الكاميرا الأمامية
    scanner.start({ facingMode: 'user' }, config, onScanSuccess, function() {})
    .then(function() {
      document.getElementById('status-msg').textContent = '✅ كاميرا أمامية — وجّه نحو الباركود';
    })
    .catch(function(err) {
      document.getElementById('status-msg').textContent = '❌ ' + err + ' — استخدم الإدخال اليدوي';
    });
  });
}

function onScanSuccess(code) {
  if (code === lastCode) return;
  lastCode = code;
  setTimeout(function() { lastCode = ''; }, 2000);
  beep();
  processCode(code);
}

function processCode(code) {
  // تحديث آخر مسح
  document.getElementById('ls-name').textContent = '✅ ' + code;
  document.getElementById('ls-code').textContent = new Date().toLocaleTimeString('ar');
  document.getElementById('last-scan-row').className = 'last-scan scan-flash';
  setTimeout(function() { document.getElementById('last-scan-row').className = 'last-scan'; }, 300);

  if (MODE === 'item') {
    // وضع صنف واحد — أرسل وأغلق
    sendCode(code);
    document.getElementById('ls-name').textContent = '✅ تم الإرسال: ' + code;
    document.getElementById('scan-badge').textContent = '✅ تم';
    document.getElementById('status-msg').textContent = 'تم مسح الباركود — يمكنك إغلاق هذه النافذة';
    if (scanner) scanner.stop();
    return;
  }

  if (MODE === 'continuous') {
    // وضع متواصل — أضف للقائمة المحلية
    var existing = scannedItems.find(function(i) { return i.code === code; });
    if (existing) {
      existing.qty++;
    } else {
      scannedItems.push({ code: code, name: code, qty: 1, price: 0 });
    }
    updateList();
    // أرسل للنظام تلقائياً
    sendCode(code);
    return;
  }

  // وضع عادي — أرسل مباشرة
  sendCode(code);
}

function sendCode(code) {
  // localStorage
  try {
    localStorage.setItem('pos_scan', JSON.stringify({ code: code, ts: Date.now() }));
  } catch(e) {}

  // postMessage للنافذة الأم
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ scannerCode: code }, '*'); } catch(e) {}
  }
}

function updateList() {
  var list = document.getElementById('items-list');
  var empty = document.getElementById('empty-msg');
  var count = scannedItems.length;
  var totalQty = scannedItems.reduce(function(s, i) { return s + i.qty; }, 0);

  document.getElementById('s-count').textContent = count;
  document.getElementById('s-items').textContent = totalQty;

  if (!count) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = scannedItems.slice().reverse().map(function(item) {
    return '<div class="item-row">' +
      '<div class="item-name">' + item.name + '</div>' +
      '<div class="item-detail">' +
      '<span class="item-qty">×' + item.qty + '</span>' +
      '</div></div>';
  }).join('');
}

function manualScan() {
  var val = document.getElementById('manual-input').value.trim();
  if (!val) return;
  document.getElementById('manual-input').value = '';
  beep();
  processCode(val);
}

function finishAndClose() {
  if (posUrl) window.open(posUrl, '_blank');
  window.close();
}

function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 1200;
    gain.gain.value = 0.15;
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

// تشغيل الماسح
window.addEventListener('load', function() {
  setTimeout(initScanner, 300);
});
</script>
</body>
</html>
