<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ماسح الباركود — كاشير الحاجي عمر</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
    :root{
      --bg:#020617;--card:#0f172a;--card2:#1e293b;
      --accent:#0ea5e9;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
      --text:#f8fafc;--muted:#94a3b8;--border:#1e293b
    }
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    
    header{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      padding:14px 18px;border-bottom:2px solid var(--accent);text-align:center
    }
    header h1{font-size:1.05rem;font-weight:900;margin-bottom:4px}
    .badge{
      display:inline-block;padding:3px 14px;border-radius:999px;
      font-size:0.75rem;font-weight:700;margin-top:2px
    }
    .badge-blue{background:var(--accent);color:#020617}
    .badge-green{background:var(--green);color:#020617}
    
    #scanner-section{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
    
    #reader{
      width:100%;max-width:400px;
      border:3px solid var(--accent);border-radius:14px;
      overflow:hidden;background:#000;min-height:220px;
      transition:border-color 0.3s,box-shadow 0.3s
    }
    #reader.flash{border-color:var(--green);box-shadow:0 0 24px rgba(34,197,94,0.5)}
    
    .card{
      width:100%;max-width:400px;
      background:var(--card2);border-radius:12px;
      padding:14px;border:1px solid var(--border)
    }
    .card-lbl{color:var(--muted);font-size:0.78rem;margin-bottom:6px}
    #last-code{font-size:1.4rem;font-weight:900;color:var(--green);min-height:38px;word-break:break-all;letter-spacing:1px}
    
    .counter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .cnt-box{
      background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.25);
      border-radius:10px;padding:12px;text-align:center
    }
    .cnt-box .num{font-size:2.4rem;font-weight:900;color:var(--accent);line-height:1}
    .cnt-box .lbl{font-size:0.78rem;color:var(--muted);margin-top:4px}
    
    .items-list{max-height:200px;overflow-y:auto;margin-top:10px}
    .scan-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:0.85rem
    }
    .scan-row:last-child{border-bottom:none}
    .qty-badge{
      background:var(--accent);color:#020617;
      border-radius:999px;padding:2px 10px;font-weight:700;font-size:0.78rem
    }
    
    .btn{
      width:100%;max-width:400px;padding:14px;border:none;border-radius:12px;
      font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;
      cursor:pointer;transition:transform 0.15s,opacity 0.15s
    }
    .btn:active{transform:scale(0.97)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .btn-green{background:var(--green);color:#fff}
    .btn-blue{background:var(--accent);color:#020617}
    .btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border)}
    
    #err{color:var(--red);text-align:center;font-size:0.85rem;padding:8px;max-width:400px}
    
    #success-section{
      display:none;flex:1;flex-direction:column;
      align-items:center;justify-content:center;padding:40px 20px;text-align:center;gap:10px
    }
    .big-icon{font-size:6rem;animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275)}
    @keyframes popIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    .success-title{font-size:1.6rem;font-weight:900}
    .success-sub{color:var(--muted);font-size:0.9rem;line-height:1.5}
    
    #notify-bar{
      position:fixed;top:0;left:0;right:0;
      background:var(--green);color:#fff;
      padding:10px;text-align:center;font-weight:700;font-size:0.9rem;
      transform:translateY(-100%);transition:transform 0.3s;z-index:100
    }
    #notify-bar.show{transform:translateY(0)}
  </style>
</head>
<body>
  <div id="notify-bar">📦 تم مسح المنتج!</div>
  
  <header>
    <h1>📷 ماسح الباركود — كاشير الحاجي عمر</h1>
    <span class="badge" id="mode-badge">جاري التحميل…</span>
  </header>

  <!-- SCANNER SECTION -->
  <div id="scanner-section">
    <div id="reader"></div>
    <div class="card">
      <div class="card-lbl">آخر باركود تم مسحه:</div>
      <div id="last-code">—</div>
    </div>
    <div id="err"></div>

    <!-- Continuous mode: counters -->
    <div id="cnt-card" class="card" style="display:none">
      <div class="counter-row">
        <div class="cnt-box"><div class="num" id="cnt-types">0</div><div class="lbl">أصناف مختلفة</div></div>
        <div class="cnt-box"><div class="num" id="cnt-units">0</div><div class="lbl">إجمالي الوحدات</div></div>
      </div>
    </div>

    <!-- Continuous mode: items list -->
    <div id="list-card" class="card" style="display:none">
      <div class="card-lbl">📦 المنتجات الممسوحة:</div>
      <div class="items-list" id="items-list">
        <div style="color:var(--muted);text-align:center;padding:14px">لم تمسح أي منتج بعد</div>
      </div>
    </div>

    <button class="btn btn-green" id="btn-finish" style="display:none" onclick="finish()">
      ✅ إنهاء المسح وإرسال للكاشير
    </button>
    <button class="btn btn-outline" id="btn-rescan" style="display:none" onclick="location.reload()">
      🔄 مسح منتج آخر
    </button>
  </div>

  <!-- SUCCESS SECTION -->
  <div id="success-section">
    <div class="big-icon">✅</div>
    <div class="success-title">تم الإرسال بنجاح!</div>
    <div class="success-sub" id="success-sub">يمكنك إغلاق هذه النافذة</div>
    <button class="btn btn-blue" style="max-width:300px" onclick="tryClose()">✕ إغلاق النافذة</button>
    <button class="btn btn-outline" style="max-width:300px" onclick="location.reload()">🔄 مسح آخر</button>
  </div>

<script>
// === STATE ===
var MODE = (new URLSearchParams(location.search).get('mode') || 'pos');
var DEBOUNCE = 1500;
var scanner = null;
var items = {}; // barcode -> count
var lastTs = 0;

// === SETUP ===
var badge = document.getElementById('mode-badge');
if (MODE === 'continuous') {
  badge.textContent = '🔄 مسح متواصل';
  badge.className = 'badge badge-green';
  show('cnt-card'); show('list-card'); show('btn-finish');
} else {
  badge.textContent = '🎯 مسح منتج واحد';
  badge.className = 'badge badge-blue';
  show('btn-rescan');
}

// === START SCANNER ===
scanner = new Html5Qrcode('reader', {verbose: false});

scanner.start(
  {facingMode: 'environment'},
  {
    fps: 15,
    qrbox: {width: 280, height: 160},
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  },
  onScan,
  function(){}
).catch(function(e) {
  document.getElementById('err').textContent = '⚠️ تعذّر الوصول للكاميرا: ' + e;
});

// === SCAN HANDLER ===
function onScan(code) {
  var now = Date.now();
  if (now - lastTs < DEBOUNCE) return;
  lastTs = now;

  code = code.trim();
  document.getElementById('last-code').textContent = code;

  // Flash border
  var r = document.getElementById('reader');
  r.classList.add('flash');
  setTimeout(function(){r.classList.remove('flash');}, 400);

  // Notify bar
  var nb = document.getElementById('notify-bar');
  if (MODE === 'continuous') {
    nb.textContent = '✅ أُضيف للفاتورة!';
  }
  nb.classList.add('show');
  setTimeout(function(){nb.classList.remove('show');}, 1200);

  // ===== إرسال فوري للكاشير في كلا الوضعين =====
  sendSingle(code); // دائماً أرسل للـ POS فوراً

  if (MODE === 'continuous') {
    addItem(code); // تتبع محلي للعداد
    // لا تغلق — استمر في المسح
  } else {
    showSuccess('pos', code); // وضع منتج واحد → أغلق بعد الإرسال
  }
}

// === ITEMS (continuous) ===
function addItem(code) {
  items[code] = (items[code] || 0) + 1;
  updateCounters();
  renderList();
}

function updateCounters() {
  var types = Object.keys(items).length;
  var units = Object.values(items).reduce(function(a,b){return a+b;},0);
  document.getElementById('cnt-types').textContent = types;
  document.getElementById('cnt-units').textContent = units;
}

function renderList() {
  var html = Object.keys(items).map(function(c) {
    return '<div class="scan-row"><span>📦 ' + c + '</span><span class="qty-badge">× ' + items[c] + '</span></div>';
  }).join('');
  document.getElementById('items-list').innerHTML = html || '<div style="color:var(--muted);text-align:center;padding:14px">لم تمسح أي منتج</div>';
}

// === SEND ===
function sendSingle(code) {
  var payload = {code: code, ts: Date.now()};
  try { localStorage.setItem('pos_scan', JSON.stringify(payload)); } catch(e) {}
  try { if (window.opener) window.opener.postMessage({scannerCode: code}, '*'); } catch(e) {}
}

function sendBatch() {
  var payload = {batch: true, items: items, ts: Date.now()};
  try { localStorage.setItem('pos_scan_batch', JSON.stringify(payload)); } catch(e) {}
  try { if (window.opener) window.opener.postMessage({scannerBatch: items}, '*'); } catch(e) {}
  // Also send individually for compatibility
  Object.keys(items).forEach(function(code) {
    for (var i = 0; i < items[code]; i++) {
      try { if (window.opener) window.opener.postMessage({scannerCode: code}, '*'); } catch(e) {}
    }
  });
}

// === FINISH ===
function finish() {
  // كل الباركودات تم إرسالها فوراً عند المسح
  // زر الإنهاء فقط يغلق النافذة
  stopScanner();
  var count = Object.values(items).reduce(function(a,b){return a+b;},0);
  document.getElementById('scanner-section').style.display='none';
  var ss = document.getElementById('success-section');
  ss.style.display='flex';
  document.getElementById('success-sub').textContent =
    'تم إرسال '+Object.keys(items).length+' صنف — '+count+' وحدة للفاتورة فوراً';
  setTimeout(tryClose, 3000);
}

// === SUCCESS ===
function showSuccess(type, code) {
  stopScanner();
  document.getElementById('scanner-section').style.display = 'none';
  var ss = document.getElementById('success-section');
  ss.style.display = 'flex';

  if (type === 'pos' && code) {
    document.getElementById('success-sub').textContent = 'الباركود: ' + code + '\nيمكنك إغلاق هذه النافذة';
    setTimeout(tryClose, 2500);
  } else {
    var count = Object.values(items).reduce(function(a,b){return a+b;},0);
    document.getElementById('success-sub').textContent =
      'تم إرسال ' + Object.keys(items).length + ' صنف — إجمالي ' + count + ' وحدة للكاشير';
  }
}

function tryClose() { try { window.close(); } catch(e) {} }
function stopScanner() { try { if (scanner && scanner.isScanning) scanner.stop(); } catch(e) {} }

// === UTILS ===
function show(id) { var el = document.getElementById(id); if (el) el.style.display = ''; }
function hide(id) { var el = document.getElementById(id); if (el) el.style.display = 'none'; }
</script>
</body>
</html>
