<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ماسح الباركود — الحاجي عمر</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background: #0d1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 20px; color: #4fc3f7; margin-bottom: 4px; }
.header p { font-size: 13px; color: rgba(255,255,255,.5); }
#qr-reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; background: #000; }
#result-box { margin-top: 16px; width: 100%; max-width: 400px; background: #161b22; border-radius: 10px; padding: 14px; }
#result-text { font-size: 13px; color: rgba(255,255,255,.6); text-align: center; margin-bottom: 10px; }
#last-scan { font-size: 20px; font-weight: bold; color: #2ecc71; text-align: center; margin-bottom: 12px; min-height: 28px; letter-spacing: 2px; }
.btn { width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 15px; font-weight: bold; margin-bottom: 8px; transition: all .2s; }
.btn-send { background: #2ecc71; color: #fff; }
.btn-send:hover { background: #27ae60; }
.btn-send:disabled { background: #1a4a2a; color: rgba(255,255,255,.3); cursor: not-allowed; }
.btn-manual { background: #0288d1; color: #fff; }
.manual-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 16px; text-align: center; letter-spacing: 2px; margin-bottom: 8px; }
.status { font-size: 12px; text-align: center; color: rgba(255,255,255,.4); margin-top: 8px; }
.scan-count { display: inline-block; background: #0288d1; color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; margin-top: 8px; }
.history { margin-top: 12px; }
.history-title { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 6px; }
.history-item { background: #0d1117; border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.history-code { color: #4fc3f7; font-weight: bold; }
.history-time { color: rgba(255,255,255,.3); font-size: 11px; }
</style>
</head>
<body>

<div class="header">
  <h1>🛒 ماسح الباركود</h1>
  <p>الحاجي عمر — نظام الكاشير</p>
</div>

<div id="qr-reader"></div>

<div id="result-box">
  <div id="result-text">في انتظار المسح...</div>
  <div id="last-scan"></div>

  <input type="text" class="manual-input" id="manual-code" placeholder="أدخل الكود يدوياً..." 
    oninput="this.value=this.value.replace(/\D/g,'')"
    onkeydown="if(event.key==='Enter') sendCode(this.value)">
  
  <button class="btn btn-send" id="send-btn" onclick="sendFromInput()" disabled>
    ✅ إرسال للنظام
  </button>

  <div class="status" id="status-msg">
    افتح نظام الكاشير أولاً ثم ابدأ المسح
  </div>
</div>

<script>
var lastCode = '';
var scanHistory = [];
var posWindow = null;
var POS_URL = '';

// قراءة URL النظام من الرابط
var params = new URLSearchParams(window.location.search);
POS_URL = params.get('pos') || '';

// تهيئة الماسح
var html5QrCode = new Html5Qrcode('qr-reader');
var config = {
  fps: 15,
  qrbox: { width: 280, height: 150 },
  aspectRatio: 1.7,
  formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODABAR
  ]
};

html5QrCode.start(
  { facingMode: 'environment' },
  config,
  function(code) { onScan(code); },
  function() {}
).then(function() {
  document.getElementById('status-msg').textContent = '✅ الكاميرا تعمل — وجّه نحو الباركود';
}).catch(function(err) {
  document.getElementById('status-msg').textContent = '❌ ' + err;
});

function onScan(code) {
  if (code === lastCode) return;
  lastCode = code;

  // صوت بيب
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 1200; gain.gain.value = 0.3;
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}

  // تحديث الواجهة
  document.getElementById('last-scan').textContent = code;
  document.getElementById('result-text').textContent = 'تم المسح:';
  document.getElementById('manual-code').value = code;
  document.getElementById('send-btn').disabled = false;

  // إضافة للتاريخ
  var now = new Date();
  scanHistory.unshift({ code: code, time: now.toLocaleTimeString('ar') });
  if (scanHistory.length > 5) scanHistory.pop();

  // إرسال تلقائي للنظام
  sendToPos(code);

  // إعادة تعيين بعد ثانيتين للمسح التالي
  setTimeout(function() { lastCode = ''; }, 2000);
}

function sendToPos(code) {
  var status = document.getElementById('status-msg');
  
  // طريقة 1: postMessage للنافذة الأم
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage({ scannerCode: code }, '*');
      status.textContent = '✅ أُرسل للنظام: ' + code;
      return;
    } catch(e) {}
  }

  // طريقة 2: localStorage كـ channel
  try {
    localStorage.setItem('pos_scan', JSON.stringify({ code: code, ts: Date.now() }));
    status.textContent = '✅ أُرسل: ' + code;
  } catch(e) {
    status.textContent = '⚠️ افتح النظام من هنا أولاً';
  }
}

function sendFromInput() {
  var code = document.getElementById('manual-code').value.trim();
  if (!code) return;
  onScan(code);
}

function sendCode(code) {
  if (!code) return;
  onScan(code);
}

// استقبال رسائل من النظام
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'ping') {
    e.source.postMessage({ type: 'pong' }, '*');
  }
});

// فتح النظام في نافذة جديدة
if (POS_URL) {
  document.getElementById('status-msg').innerHTML =
    '<a href="' + POS_URL + '" target="_blank" ' +
    'style="color:#4fc3f7;text-decoration:none" onclick="posWindow=window.open(this.href,\'_blank\');return false;">' +
    '🌐 افتح نظام الكاشير ←</a>';
}
</script>

</body>
</html>
