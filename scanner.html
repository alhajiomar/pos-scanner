<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>مسح مشتريات الزبون — كاشير الحاجي عمر</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
    :root{
      --bg:#020617;--card:#0f172a;--card2:#1e293b;
      --accent:#0ea5e9;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
      --text:#f8fafc;--muted:#94a3b8;--border:#1e293b
    }
    body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      padding:16px 18px;border-bottom:3px solid var(--green);text-align:center
    }
    header h1{font-size:1.3rem;font-weight:900;margin-bottom:6px}
    .badge{
      display:inline-block;padding:4px 18px;border-radius:999px;
      font-size:0.85rem;font-weight:700;margin-top:2px
    }
    .badge-green{background:var(--green);color:#020617}
    .badge-blue{background:var(--accent);color:#020617}

    #scanner-section{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}

    /* الماسح كبير */
    #reader{
      width:100%;max-width:520px;
      border:4px solid var(--green);border-radius:18px;
      overflow:hidden;background:#000;min-height:300px;
      transition:border-color 0.3s,box-shadow 0.3s
    }
    #reader.flash-ok{border-color:var(--green);box-shadow:0 0 32px rgba(34,197,94,0.6)}
    #reader.flash-bad{border-color:var(--red);box-shadow:0 0 32px rgba(239,68,68,0.6)}

    .card{
      width:100%;max-width:520px;
      background:var(--card2);border-radius:14px;
      padding:16px;border:1px solid var(--border)
    }
    .card-lbl{color:var(--muted);font-size:0.85rem;margin-bottom:8px}
    #last-code{font-size:1.7rem;font-weight:900;color:var(--green);min-height:42px;word-break:break-all;letter-spacing:1px}
    #last-code.bad{color:var(--red)}

    .counter-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .cnt-box{
      background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);
      border-radius:12px;padding:16px;text-align:center
    }
    .cnt-box .num{font-size:3rem;font-weight:900;color:var(--green);line-height:1}
    .cnt-box .lbl{font-size:0.85rem;color:var(--muted);margin-top:6px}

    .items-list{max-height:260px;overflow-y:auto;margin-top:12px}
    .scan-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:0.95rem
    }
    .scan-row:last-child{border-bottom:none}
    .scan-row.bad span:first-child{color:var(--red)}
    .qty-badge{
      background:var(--green);color:#020617;
      border-radius:999px;padding:3px 14px;font-weight:900;font-size:0.9rem
    }
    .bad-badge{
      background:var(--red);color:#fff;
      border-radius:999px;padding:3px 12px;font-weight:700;font-size:0.78rem
    }
    .btn{
      width:100%;max-width:520px;padding:16px;border:none;border-radius:14px;
      font-family:'Cairo',sans-serif;font-size:1.1rem;font-weight:900;
      cursor:pointer;transition:transform 0.15s,opacity 0.15s
    }
    .btn:active{transform:scale(0.97)}
    .btn-green{background:var(--green);color:#020617}
    .btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border)}

    #err{color:var(--red);text-align:center;font-size:0.9rem;padding:8px;max-width:520px}

    /* شريط الإشعار الكبير أعلى الشاشة */
    #notify-bar{
      position:fixed;top:0;left:0;right:0;
      padding:14px;text-align:center;font-weight:900;font-size:1.05rem;
      transform:translateY(-100%);transition:transform 0.3s;z-index:100;color:#fff
    }
    #notify-bar.ok{background:var(--green)}
    #notify-bar.bad{background:var(--red)}
    #notify-bar.show{transform:translateY(0)}

    .hint-box{
      width:100%;max-width:520px;background:rgba(14,165,233,0.08);
      border:1px solid rgba(14,165,233,0.2);border-radius:12px;
      padding:12px 14px;font-size:0.85rem;color:var(--muted);line-height:1.6;text-align:center
    }
  </style>
</head>
<body>
  <div id="notify-bar">📦 تم!</div>

  <header>
    <h1>🛒 مسح مشتريات الزبون</h1>
    <span class="badge badge-green" id="mode-badge">مسح متواصل — الفاتورة تتحدث فوراً</span>
  </header>

  <div id="scanner-section">
    <div id="reader"></div>

    <div class="hint-box" id="hint-box">
      وجّه الكاميرا نحو باركود المنتج. كل منتج يُضاف للفاتورة فوراً. أعد مسح نفس المنتج لزيادة الكمية.
    </div>

    <div class="card">
      <div class="card-lbl">آخر باركود تم مسحه:</div>
      <div id="last-code">—</div>
    </div>
    <div id="err"></div>

    <!-- عدّادات (تظهر في وضع المسح المتواصل) -->
    <div id="cnt-card" class="card" style="display:none">
      <div class="counter-row">
        <div class="cnt-box"><div class="num" id="cnt-types">0</div><div class="lbl">أصناف مضافة</div></div>
        <div class="cnt-box"><div class="num" id="cnt-units">0</div><div class="lbl">إجمالي القطع</div></div>
      </div>
    </div>

    <!-- قائمة المنتجات الممسوحة -->
    <div id="list-card" class="card" style="display:none">
      <div class="card-lbl">📦 المنتجات المضافة للفاتورة:</div>
      <div class="items-list" id="items-list">
        <div style="color:var(--muted);text-align:center;padding:16px">ابدأ بمسح أول منتج…</div>
      </div>
    </div>

    <button class="btn btn-outline" id="btn-rescan" style="display:none" onclick="location.reload()">
      🔄 مسح منتج آخر
    </button>
    <button class="btn btn-green" id="btn-done">✅ تم — إغلاق الماسح</button>
  </div>

<script>
// ═══════════ الحالة ═══════════
var MODE = (new URLSearchParams(location.search).get('mode') || 'continuous');
var DEBOUNCE = 1200;      // منع المسح المزدوج السريع لنفس اللحظة
var scanner = null;
var items = {};           // باركود → عدد (المقبول)
var names = {};           // باركود → اسم
var rejected = {};        // باركود → عدد (غير موجود)
var lastCode = '';
var lastTs = 0;

// ═══════════ الإعداد حسب الوضع ═══════════
var badge = document.getElementById('mode-badge');
if (MODE === 'pos') {
  // وضع منتج واحد
  badge.textContent = 'مسح صنف واحد';
  badge.className = 'badge badge-blue';
  document.querySelector('header h1').textContent = '📷 مسح صنف';
  show('btn-rescan');
} else {
  // وضع المسح المتواصل (الافتراضي)
  show('cnt-card'); show('list-card');
}

// ═══════════ تشغيل الكاميرا ═══════════
scanner = new Html5Qrcode('reader', {verbose: false});
scanner.start(
  {facingMode: 'environment'},
  {
    fps: 15,
    qrbox: {width: 320, height: 200},
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  },
  onScan,
  function(){}
).catch(function(e) {
  document.getElementById('err').textContent = '⚠️ تعذّر الوصول للكاميرا: ' + e;
});

// ═══════════ عند المسح — إرسال فوري للكاشير ═══════════
function onScan(code) {
  var now = Date.now();
  code = String(code).trim();
  // السماح بإعادة مسح نفس الباركود بعد مهلة قصيرة (لزيادة الكمية)
  if (code === lastCode && (now - lastTs) < DEBOUNCE) return;
  if (code !== lastCode && (now - lastTs) < 400) return; // منع رشقات سريعة مختلطة
  lastCode = code; lastTs = now;

  document.getElementById('last-code').textContent = code;
  document.getElementById('last-code').classList.remove('bad');

  // إرسال فوري للكاشير — هو يضيفه للفاتورة ويرد بالنتيجة
  sendToCashier(code);
}

// ═══════════ إرسال الباركود للكاشير ═══════════
function sendToCashier(code) {
  var payload = {code: code, ts: Date.now()};
  // 1) localStorage (الجسر الأساسي مع نافذة الكاشير)
  try { localStorage.setItem('pos_scan', JSON.stringify(payload)); } catch(e) {}
  // 2) postMessage للنافذة الأم إن وُجدت
  try { if (window.opener && !window.opener.closed) window.opener.postMessage({scannerCode: code}, '*'); } catch(e) {}
}

// ═══════════ استقبال نتيجة الكاشير (موجود / غير موجود) ═══════════
window.addEventListener('message', function(e){
  if (e.data && e.data.scannerVerdict) handleVerdict(e.data.scannerVerdict);
});
// قراءة احتياطية من localStorage
setInterval(function(){
  try {
    var raw = localStorage.getItem('pos_verdict');
    if (raw) {
      var v = JSON.parse(raw);
      if (Date.now() - v.ts < 4000) {
        handleVerdict(v);
        localStorage.removeItem('pos_verdict');
      }
    }
  } catch(e){}
}, 250);

// ═══════════ معالجة النتيجة ═══════════
function handleVerdict(v) {
  var code = String(v.code || '').trim();
  if (!code) return;

  var r = document.getElementById('reader');
  var nb = document.getElementById('notify-bar');

  if (v.ok) {
    // ✅ موجود وأُضيف للفاتورة
    r.classList.add('flash-ok');
    setTimeout(function(){ r.classList.remove('flash-ok'); }, 400);
    beep(true);

    nb.className = 'ok show';
    nb.textContent = '✅ أُضيف للفاتورة: ' + (v.name || code);
    setTimeout(function(){ nb.classList.remove('show'); }, 1300);

    if (MODE === 'continuous') {
      items[code] = (items[code] || 0) + 1;
      if (v.name) names[code] = v.name;
      delete rejected[code];
      updateCounters();
      renderList();
      // يبقى يمسح — لا إغلاق
    } else {
      showSuccess(true, code, v.name);
    }
  } else {
    // ❌ غير موجود بالمستودع
    r.classList.add('flash-bad');
    setTimeout(function(){ r.classList.remove('flash-bad'); }, 600);
    beep(false);

    document.getElementById('last-code').classList.add('bad');

    nb.className = 'bad show';
    nb.textContent = '❌ غير موجود بالمستودع: ' + code;
    setTimeout(function(){ nb.classList.remove('show'); }, 2400);

    if (MODE === 'continuous') {
      rejected[code] = (rejected[code] || 0) + 1;
      renderList();
    } else {
      showSuccess(false, code, '');
    }
  }
}

// ═══════════ العدّادات والقائمة ═══════════
function updateCounters() {
  var codes = Object.keys(items);
  var types = codes.length;
  var units = codes.reduce(function(a,k){ return a + items[k]; }, 0);
  document.getElementById('cnt-types').textContent = types;
  document.getElementById('cnt-units').textContent = units;
}
function renderList() {
  var html = '';
  Object.keys(items).forEach(function(c) {
    var label = names[c] || c;
    html += '<div class="scan-row"><span>📦 ' + esc(label) + '</span><span class="qty-badge">× ' + items[c] + '</span></div>';
  });
  Object.keys(rejected).forEach(function(c) {
    html += '<div class="scan-row bad"><span>⛔ ' + esc(c) + '</span><span class="bad-badge">غير موجود</span></div>';
  });
  document.getElementById('items-list').innerHTML = html ||
    '<div style="color:var(--muted);text-align:center;padding:16px">ابدأ بمسح أول منتج…</div>';
}

// ═══════════ نغمة بسيطة للتأكيد ═══════════
function beep(ok) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = ok ? 880 : 220;
    gain.gain.value = 0.15;
    osc.start();
    setTimeout(function(){ osc.stop(); ctx.close(); }, ok ? 120 : 250);
  } catch(e){}
}

// ═══════════ وضع المنتج الواحد: شاشة النتيجة ═══════════
function showSuccess(ok, code, name) {
  // في وضع المنتج الواحد نُبقي الماسح شغالاً لكن نُظهر الإشعار فقط
  // (لا نُغلق تلقائياً حتى يرى التاجر النتيجة)
}

// ═══════════ زر الإغلاق ═══════════
document.getElementById('btn-done').onclick = function(){
  stopScanner();
  tryClose();
};

function tryClose() { try { window.close(); } catch(e) {} }
function stopScanner() { try { if (scanner && scanner.isScanning) scanner.stop(); } catch(e) {} }

// ═══════════ أدوات ═══════════
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function show(id){ var el=document.getElementById(id); if(el) el.style.display=''; }
function hide(id){ var el=document.getElementById(id); if(el) el.style.display='none'; }
</script>
</body>
</html>
